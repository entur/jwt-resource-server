syntax = "proto3";

option java_multiple_files = true;
package org.entur.jwt.spring.demo.grpc;

message GreetingRequest {
}

message GreetingResponse {
    sint64 id = 1;
    string message = 2;
}

service GreetingService {
    // no authentication required
    rpc unprotected (GreetingRequest) returns (GreetingResponse);

    // requires a valid bearer token
    rpc protectedGreeting (GreetingRequest) returns (GreetingResponse);
}
