version: 2
updates:
  - package-ecosystem: "maven"
    directories:
      - "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
    groups:
      # one pull request for all minor and patch updates, so they do not conflict with each other
      maven-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "github-actions"
    directory: ".github/workflows"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7

