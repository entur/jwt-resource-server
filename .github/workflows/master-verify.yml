name: Verify master
on:
  push:
    branches:
      - master

jobs:
  verify-main:
    uses: entur/abt-gha-public/.github/workflows/maven-open-source-verify.yml@main
    # no secrets necessary
    permissions:
        contents: read
    with:
      java-version: 25

  coverage-report:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Run tests (all modules)
        run: mvn -B test
      - name: Build cross-module coverage report
        run: .github/scripts/jacoco-flat-report.sh
      - uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-report
          path: target/jacoco-flat-report
          retention-days: 30

  post-failure-to-slack:
    needs: verify-main
    if: failure()
    uses: entur/gha-slack/.github/workflows/post.yml@v3
    permissions:
      contents: read
    with:
      channel_id: ${{ vars.CHANNEL_ID }}
      message: "🔴 Maven build failed for ${{ github.repository }}\n ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
    secrets: inherit

  post-success-to-slack:
    needs: verify-main
    if: success()
    uses: entur/gha-slack/.github/workflows/post.yml@v3
    permissions:
      contents: read
    with:
      channel_id: ${{ vars.CHANNEL_ID}}
      message: "🟢 Maven build success for ${{ github.repository }}\n ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
    secrets: inherit
