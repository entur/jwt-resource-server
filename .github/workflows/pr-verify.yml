name: Verify PR
on:
  pull_request:
    types:
      - synchronize
      - opened

jobs:
  verify-pr:
    uses: entur/abt-gha-public/.github/workflows/maven-open-source-verify.yml@main
    permissions:
      contents: read
    # no secrets necessary
    with:
      java-version: 25

  coverage-report:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Run tests (all modules)
        run: mvn -B test
      - name: Build cross-module coverage report
        run: .github/scripts/jacoco-flat-report.sh
      - uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-report
          path: target/jacoco-flat-report
          retention-days: 30
