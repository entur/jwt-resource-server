entur:
  jwt:
    enabled: true
    claims:
      expires-at-leeway: 15
      issued-at-leeway: 5
      audiences:
        - https://my.audience
    mdc:
      enabled: true
      mappings:
        - from: iss
          to: issuer
        - from: azp
          to: azp
  authorization:
    permit-all:
      grpc:
        services:
          - name: org.entur.jwt.spring.grpc.test.GreetingService
            methods:
              - unprotected
              - unprotectedWithOptionalTenant
          - name: grpc.health.v1.Health
            methods:
              - "*"
      matcher:
        patterns:
          - /actuator/health

spring:
  grpc:
    server:
      servlet:
        # the gRPC servlet is on the test classpath, use the native gRPC server
        enabled: false

logging:
  level:
    root: DEBUG
    org:
      apache:
        tomcat:
          util:
            compat: INFO
    io:
      grpc:
        internal: INFO